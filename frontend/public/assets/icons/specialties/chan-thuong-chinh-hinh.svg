<!-- filename: public/icons/specialties/chan-thuong-chinh-hinh.svg -->
<!-- Orthopedics – Fractured bone with fixation plate (28x28), fixed brand color -->
<svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g fill="none" stroke="#4C6FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- bone shaft -->
    <path d="M9 9 L15 15"/>
    <!-- rounded bone heads -->
    <circle cx="7.25" cy="7.25" r="2.25"/>
    <circle cx="16.75" cy="16.75" r="2.25"/>
    <!-- fracture crack -->
    <path d="M10.8 10.8 l.6-.6 .9.35 .6-.6"/>
    <!-- fixation plate (rotated rounded rectangle) -->
    <g transform="rotate(45 12 12)">
      <rect x="10.1" y="9.5" width="3.8" height="5.0" rx="0.9" ry="0.9"/>
      <!-- screw holes -->
      <circle cx="12" cy="10.8" r="0.55" fill="#4C6FFF" stroke="none"/>
      <circle cx="12" cy="13.2" r="0.55" fill="#4C6FFF" stroke="none"/>
    </g>
  </g>
</svg>
